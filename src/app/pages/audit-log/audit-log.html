<app-page-header heading="Audit Log" subtitle="A record of who did what, when and from where.">
  <button
    type="button"
    class="inline-flex min-h-11 items-center justify-center rounded-[10px] bg-[#F28C1B] px-5 text-sm font-extrabold text-[#0A0A3C] transition hover:-translate-y-px hover:shadow-[0_8px_20px_rgba(242,140,27,.45)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
    (click)="downloadCsv()"
  >
    Download CSV
  </button>
</app-page-header>

<section class="rounded-2xl border border-[#E6E6F0] bg-white p-6 shadow-sm">
  <div class="mb-4 flex flex-wrap gap-3">
    <input
      type="search"
      aria-label="Search"
      placeholder="Search audit log"
      class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30 min-w-56 flex-1"
      [formField]="filters.search"
    />
    <select
      aria-label="Filter"
      class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30 sm:w-auto"
      [formField]="filters.filter"
    >
      @for (o of filterOptions; track o) {
      <option [value]="o">{{ o }}</option>
      }
    </select>
    <button
      type="button"
      class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
    >
      Export
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full min-w-[720px] border-collapse">
      <thead>
        <tr>
          <th
            scope="col"
            class="whitespace-nowrap border-b border-[#E6E6F0] px-4 py-3 text-left text-xs font-bold uppercase tracking-wide text-[#6B6B85]"
          >
            Time
          </th>
          <th
            scope="col"
            class="whitespace-nowrap border-b border-[#E6E6F0] px-4 py-3 text-left text-xs font-bold uppercase tracking-wide text-[#6B6B85]"
          >
            Actor
          </th>
          <th
            scope="col"
            class="whitespace-nowrap border-b border-[#E6E6F0] px-4 py-3 text-left text-xs font-bold uppercase tracking-wide text-[#6B6B85]"
          >
            Action
          </th>
          <th
            scope="col"
            class="whitespace-nowrap border-b border-[#E6E6F0] px-4 py-3 text-left text-xs font-bold uppercase tracking-wide text-[#6B6B85]"
          >
            Entity
          </th>
          <th
            scope="col"
            class="whitespace-nowrap border-b border-[#E6E6F0] px-4 py-3 text-left text-xs font-bold uppercase tracking-wide text-[#6B6B85]"
          >
            IP address
          </th>
          <th
            scope="col"
            class="whitespace-nowrap border-b border-[#E6E6F0] px-4 py-3 text-left text-xs font-bold uppercase tracking-wide text-[#6B6B85]"
          >
            Result
          </th>
        </tr>
      </thead>
      <tbody>
        @for (r of rows(); track r.id) {
        <tr class="hover:bg-[#FAFAFD]">
          <td class="border-b border-[#EEEEF6] px-4 py-3.5 text-sm whitespace-nowrap font-bold text-[#0A0A3C]">{{ r.time }}</td>
          <td class="border-b border-[#EEEEF6] px-4 py-3.5 text-sm text-[#3A3A5C]">{{ r.actor }}</td>
          <td class="border-b border-[#EEEEF6] px-4 py-3.5 text-sm text-[#3A3A5C]">{{ r.action }}</td>
          <td class="border-b border-[#EEEEF6] px-4 py-3.5 text-sm text-[#3A3A5C]">{{ r.entity }}</td>
          <td class="border-b border-[#EEEEF6] px-4 py-3.5 text-sm text-[#3A3A5C]">{{ r.ip }}</td>
          <td class="border-b border-[#EEEEF6] px-4 py-3.5 text-sm text-[#3A3A5C]"><app-status-badge [status]="r.result" /></td>
        </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="mt-4 flex flex-wrap items-center justify-between gap-3 text-sm text-[#6B6B85]">
    <span>Showing 1–6 of 9,310</span>
    <span class="flex gap-2">
      <button
        type="button"
        class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
      >
        Previous
      </button>
      <button
        type="button"
        class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
      >
        Next
      </button>
    </span>
  </div>
</section>
