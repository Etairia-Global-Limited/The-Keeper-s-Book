<a routerLink="/applications" class="mb-1 inline-flex min-h-11 items-center text-sm font-bold text-[#9A4F00] hover:underline"
  >← Applications</a
>

<app-page-header
  [heading]="isEdit() ? 'Edit application' : 'New application'"
  [subtitle]="isEdit() ? 'Update the details and save your changes.' : 'Fill in the details below.'"
/>

<app-page-loader [visible]="loadingOwner()" />

<form novalidate (submit)="save($event)" class="rounded-2xl border border-[#E6E6F0] bg-white p-6 shadow-sm">
  <div class="grid gap-5 md:grid-cols-2">
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Name
      <input
        type="text"
        placeholder="Name"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.name"
      />
      @if (f.name().touched() && f.name().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.name().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Support Mail
      <input
        type="text"
        placeholder="support@company.com"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.supportMail"
      />
      @if (f.supportMail().touched() && f.supportMail().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.supportMail().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Client
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.ownerId"
      >
        <option value="">Select…</option>
        @for (o of clientOptions(); track o) {
        <option [value]="o.id">{{ o.name }}</option>
        }
      </select>
      @if (f.ownerId().touched() && f.ownerId().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.ownerId().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Environment
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.environment"
      >
        <option value="">Select…</option>
        @for (o of environmentOptions; track o) {
        <option [value]="o">{{ o }}</option>
        }
      </select>
      @if (f.environment().touched() && f.environment().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.environment().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Redirect URL
      <input
        type="text"
        placeholder="Redirect URL"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.redirectUrl"
      />
      @if (f.redirectUrl().touched() && f.redirectUrl().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.redirectUrl().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Status
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.applicationStatus"
      >
        <option value="">Select…</option>
        @for (o of statusOptions; track o) {
        <option [value]="o">{{ o }}</option>
        }
      </select>
      @if (f.applicationStatus().touched() && f.applicationStatus().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.applicationStatus().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B] md:col-span-2">
      Description
      <textarea
        rows="4"
        placeholder="Description"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30 py-3"
        [formField]="f.description"
      ></textarea>
      @if (f.description().touched() && f.description().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.description().errors()[0]?.message }}</span>
      }
    </label>
  </div>

  <div class="mt-8 flex flex-wrap justify-end gap-3 border-t border-[#EEEEF6] pt-6">
    <a
      routerLink="/applications"
      class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
      >Cancel</a
    >
    <!-- <button
      type="submit"
      class="inline-flex min-h-11 items-center justify-center rounded-[10px] bg-[#F28C1B] px-5 text-sm font-extrabold text-[#0A0A3C] transition hover:-translate-y-px hover:shadow-[0_8px_20px_rgba(242,140,27,.45)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
    >
      {{ isEdit() ? 'Save changes' : 'Create' }}
    </button> -->
    <app-loading-button type="submit" [loading]="loading()" loadingLabel="Saving…">{{ isEdit() ? 'Save changes' : 'Create' }}</app-loading-button>

  </div>
</form>
