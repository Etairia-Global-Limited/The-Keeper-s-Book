<a routerLink="/application-users" class="mb-1 inline-flex min-h-11 items-center text-sm font-bold text-[#9A4F00] hover:underline"
  >← Application Users</a
>

<app-page-header
  [heading]="isEdit() ? 'Edit application user' : 'New application user'"
  [subtitle]="isEdit() ? 'Update the details and save your changes.' : 'Fill in the details below.'"
/>

<form novalidate (submit)="save($event)" class="rounded-2xl border border-[#E6E6F0] bg-white p-6 shadow-sm">
  <div class="grid gap-5 md:grid-cols-2">
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      User
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.userId"
      >
        <option value="">Select…</option>
        @for (o of userOptions(); track o.id) {
        <option [value]="o.id">{{ o.email }}</option>
        }
      </select>
      @if (f.userId().touched() && f.userId().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.userId().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Application
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.applicationId"
        (change)="getRole($any($event.target).value)"
      >
        <option value="">Select…</option>
        @for (o of applicationOptions(); track o.id) {
        <option [value]="o.id">{{ o.name }}</option>
        }
      </select>
      @if (f.applicationId().touched() && f.applicationId().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.applicationId().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Role
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.roleId"
      >
        <option value="">Select…</option>
        @for (o of roleOptions(); track o.id) {
        <option [value]="o.id">{{ o.name }}</option>
        }
      </select>
      @if (f.roleId().touched() && f.roleId().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.roleId().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Country
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.countryCode"
      >
        <option value="">Select…</option>
        @for (o of countryCode(); track o.id) {
        <option [value]="o.countryCode">{{ o.name }}</option>
        }
      </select>
      @if (f.countryCode().touched() && f.countryCode().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.countryCode().errors()[0]?.message }}</span>
      }
    </label>
  
  </div>

  <div class="mt-8 flex flex-wrap justify-end gap-3 border-t border-[#EEEEF6] pt-6">
    <a
      routerLink="/application-users"
      class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
      >Cancel</a
    >
    <button
      type="submit"
      class="inline-flex min-h-11 items-center justify-center rounded-[10px] bg-[#F28C1B] px-5 text-sm font-extrabold text-[#0A0A3C] transition hover:-translate-y-px hover:shadow-[0_8px_20px_rgba(242,140,27,.45)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
    >
      {{ isEdit() ? 'Save changes' : 'Create' }}
    </button>
  </div>
</form>
