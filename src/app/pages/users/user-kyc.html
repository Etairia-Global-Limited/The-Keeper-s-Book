<a routerLink="/users" class="mb-1 inline-flex min-h-11 items-center text-sm font-bold text-[#9A4F00] hover:underline">← Users</a>

<app-page-header heading="KYC review" [subtitle]="user.name + ' · ' + user.email + ' · ' + user.client">
  <app-status-badge [status]="overall()" />
</app-page-header>

<div class="grid gap-4 lg:grid-cols-[minmax(280px,1fr)_2fr]">
  <section class="rounded-2xl border border-[#E6E6F0] bg-white p-6 shadow-sm">
    <h2 class="mb-4 text-base font-extrabold text-[#0A0A3C]">Submitted documents</h2>
    <div class="flex flex-col gap-2">
      @for (d of docs(); track d.title; let i = $index) {
      <button
        type="button"
        class="flex min-h-14 items-center justify-between gap-3 rounded-xl border px-4 py-3 text-left transition"
        [class]="i === selected() ? 'border-[#F28C1B] bg-[#F28C1B]/10' : 'border-[#E6E6F0] bg-white hover:bg-[#F6F6FA]'"
        [attr.aria-pressed]="i === selected()"
        (click)="pick(i)"
      >
        <span>
          <b class="block text-sm font-bold text-[#0A0A3C]">{{ d.title }}</b>
          <span class="text-xs text-[#6B6B85]">{{ d.category }} · {{ d.submitted }}</span>
        </span>
        <app-status-badge [status]="d.status" />
      </button>
      }
    </div>
  </section>

  <section class="rounded-2xl border border-[#E6E6F0] bg-white p-6 shadow-sm">
    <h2 class="mb-4 text-base font-extrabold text-[#0A0A3C]">{{ current().title }}</h2>

    <!-- TODO: render the real file (image / PDF) here -->
    <div
      class="mb-5 grid aspect-[16/9] place-items-center rounded-xl border-2 border-dashed border-[#D9D9E8] bg-[#F6F6FA] text-center text-sm text-[#6B6B85]"
    >
      <span>Document preview<br /><span class="font-semibold text-[#3A3A5C]">{{ current().file }}</span></span>
    </div>

    <dl class="mb-6 grid gap-x-6 gap-y-3 sm:grid-cols-2">
      @for (x of current().details; track x.label) {
      <div class="flex flex-col gap-0.5 border-b border-[#EEEEF6] pb-2">
        <dt class="text-xs font-bold uppercase tracking-wide text-[#6B6B85]">{{ x.label }}</dt>
        <dd class="text-sm font-bold text-[#0A0A3C]">{{ x.value }}</dd>
      </div>
      }
    </dl>

    <form novalidate (submit)="$event.preventDefault()" class="flex flex-col gap-3">
      <fieldset>
        <legend class="mb-2 text-[13px] font-semibold text-[#14142B]">Checks</legend>
        <div class="flex flex-col">
          <label class="flex min-h-11 cursor-pointer items-center gap-2.5 text-sm"
            ><input type="checkbox" class="size-4 accent-[#F28C1B]" [formField]="review.imageClear" /> Image is clear and complete</label
          >
          <label class="flex min-h-11 cursor-pointer items-center gap-2.5 text-sm"
            ><input type="checkbox" class="size-4 accent-[#F28C1B]" [formField]="review.nameMatches" /> Name matches profile</label
          >
          <label class="flex min-h-11 cursor-pointer items-center gap-2.5 text-sm"
            ><input type="checkbox" class="size-4 accent-[#F28C1B]" [formField]="review.notExpired" /> Document is not expired</label
          >
        </div>
      </fieldset>

      <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
        Reviewer note
        <textarea
          rows="3"
          placeholder="Reason — required when rejecting"
          class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30 py-3"
          [formField]="review.note"
        ></textarea>
        @if (review.note().touched() && review.note().invalid()) {
        <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ review.note().errors()[0]?.message }}</span>
        }
      </label>

      <div class="mt-3 flex flex-wrap justify-end gap-3 border-t border-[#EEEEF6] pt-5">
        <button
          type="button"
          class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
          (click)="requestReupload()"
        >
          Request re-upload
        </button>
        <button
          type="button"
          class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C] !text-[#B3261E]"
          (click)="reject()"
        >
          Reject
        </button>
        <button
          type="button"
          class="inline-flex min-h-11 items-center justify-center rounded-[10px] bg-[#F28C1B] px-5 text-sm font-extrabold text-[#0A0A3C] transition hover:-translate-y-px hover:shadow-[0_8px_20px_rgba(242,140,27,.45)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
          (click)="approve()"
        >
          Approve
        </button>
      </div>
    </form>
  </section>
</div>
