<a routerLink="/users" class="mb-1 inline-flex min-h-11 items-center text-sm font-bold text-[#9A4F00] hover:underline">← Users</a>

<app-page-header
  [heading]="isEdit() ? 'Edit user' : 'New user'"
  [subtitle]="isEdit() ? 'Update the details and save your changes.' : 'Fill in the details below.'"
/>

<form novalidate (submit)="save($event)" class="rounded-2xl border border-[#E6E6F0] bg-white p-6 shadow-sm">
  <div class="grid gap-5 md:grid-cols-2">
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      First name
      <input
        type="text"
        placeholder="First name"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.firstName"
      />
      @if (f.firstName().touched() && f.firstName().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.firstName().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Last name
      <input
        type="text"
        placeholder="Last name"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.lastName"
      />
      @if (f.lastName().touched() && f.lastName().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.lastName().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Email
      <input
        type="email"
        placeholder="Email"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.email"
      />
      @if (f.email().touched() && f.email().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.email().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Username
      <input
        type="text"
        placeholder="Username"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.username"
      />
      @if (f.username().touched() && f.username().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.username().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Phone Number
      <input
        type="text"
        placeholder="Phone Number"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.phoneNumber"
      />
      @if (f.phoneNumber().touched() && f.phoneNumber().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.phoneNumber().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Application
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        (change)="getRole($any($event.target).value)"
        [formField]="f.applicationId"
      >
        <option value="">Select Application…</option>
        @for (o of application(); track o.id) {
        <option [value]="o.id">{{ o.name }}</option>
        }
      </select>
      @if (f.applicationId().touched() && f.applicationId().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.applicationId().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Application Role 
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.roleId"
      >
        <option value="">Select Role…</option>
        @for (o of role(); track o.id) {
        <option [value]="o.id">{{ o.name }}</option>
        }
      </select>
      @if (f.roleId().touched() && f.roleId().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.roleId().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Country
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.countryCode"
      >
        <option value="">Select Country…</option>
        @for (o of country(); track o.id) {
        <option [value]="o.countryCode">{{ o.name }}</option>
        }
      </select>
      @if (f.countryCode().touched() && f.countryCode().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.countryCode().errors()[0]?.message }}</span>
      }
    </label>
        <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B] md:col-span-2">
      Address
      <textarea
        rows="4"
        placeholder="Address"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30 py-3"
        [formField]="f.address"
      ></textarea>
      @if (f.address().touched() && f.address().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.address().errors()[0]?.message }}</span>
      }
    </label>
  </div>

  <div class="mt-8 flex flex-wrap justify-end gap-3 border-t border-[#EEEEF6] pt-6">
    <a
      routerLink="/users"
      class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
      >Cancel</a
    >
    <button
      type="submit"
      class="inline-flex min-h-11 items-center justify-center rounded-[10px] bg-[#F28C1B] px-5 text-sm font-extrabold text-[#0A0A3C] transition hover:-translate-y-px hover:shadow-[0_8px_20px_rgba(242,140,27,.45)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
    >
      Create
    </button>
  </div>
</form>
