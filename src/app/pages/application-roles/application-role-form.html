<a routerLink="/application-roles" class="mb-1 inline-flex min-h-11 items-center text-sm font-bold text-[#9A4F00] hover:underline"
  >← Application Roles</a
>

<app-page-header
  [heading]="isEdit() ? 'Edit application role' : 'New application role'"
  [subtitle]="isEdit() ? 'Update the details and save your changes.' : 'Fill in the details below.'"
/>

<app-page-loader [visible]="loadingOwner()" />

<form novalidate (submit)="save($event)" class="rounded-2xl border border-[#E6E6F0] bg-white p-6 shadow-sm">
  <div class="grid gap-5 md:grid-cols-2">
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Role name
      <input
        type="text"
        placeholder="Role name"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.name"
      />
      @if (f.name().touched() && f.name().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.name().errors()[0]?.message }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
      Application
      <select
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
        [formField]="f.applicationId"
      >
        <option value="">Select…</option>
        @for (o of applicationOptions(); track o) {
        <option [value]="o.id">{{ o.name }}</option>
        }
      </select>
      @if (f.applicationId().touched() && f.applicationId().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.applicationId().errors()[0]?.message }}</span>
      }
    </label>

      Status

        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"

    </label> -->
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B] md:col-span-2">
      Description
      <textarea
        rows="4"
        placeholder="Description"
        class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30 py-3"
        [formField]="f.description"
      ></textarea>
      @if (f.description().touched() && f.description().invalid()) {
      <span class="text-xs font-medium text-[#B3261E]" role="alert">{{ f.description().errors()[0]?.message }}</span>
      }
    </label>
