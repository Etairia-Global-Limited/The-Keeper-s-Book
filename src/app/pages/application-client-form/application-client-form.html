<a
  routerLink="/application-clients"
  class="mb-1 inline-flex min-h-11 items-center text-sm font-bold text-[#9A4F00] hover:underline"
  >← Application clients</a
>

<app-page-header
  heading="New application client"
  subtitle="Create credentials for an application."
/>

<app-page-loader [visible]="loadingApplications()" />

@if (createdSecret()) {
  <section class="rounded-2xl border border-[#E6E6F0] bg-white p-6 shadow-sm" role="status">
    <h2 class="text-base font-extrabold text-[#0A0A3C]">Copy the client secret now</h2>
    <p class="mt-1 text-sm text-[#3A3A5C]">
      It won't be shown again. If it's lost, you'll need to create a new one.
    </p>
    <div class="mt-4 flex flex-wrap items-center gap-3">
      <code
        class="min-h-11 flex-1 break-all rounded-[10px] border border-[#D9D9E8] bg-[#F6F6FA] px-3.5 py-3 text-sm text-[#14142B]"
        >{{ createdSecret() }}</code
      >
      <button
        type="button"
        class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
        (click)="copySecret()"
      >
        {{ copied() ? 'Copied' : 'Copy' }}
      </button>
    </div>
    <div class="mt-6 flex justify-end border-t border-[#EEEEF6] pt-6">
      <button
        type="button"
        class="inline-flex min-h-11 items-center justify-center rounded-[10px] bg-[#F28C1B] px-5 text-sm font-extrabold text-[#0A0A3C] transition hover:-translate-y-px hover:shadow-[0_8px_20px_rgba(242,140,27,.45)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
        (click)="done()"
      >
        I've saved it
      </button>
    </div>
  </section>
} @else {
  <form
    novalidate
    (submit)="save($event)"
    class="rounded-2xl border border-[#E6E6F0] bg-white p-6 shadow-sm"
  >
    @if (submitError()) {
      <p role="alert" class="mb-4 text-sm font-semibold text-[#B42318]">{{ submitError() }}</p>
    }

    <div class="grid gap-5 md:grid-cols-2">
      <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
        Client ID
        <input
          type="text"
          placeholder="Client ID"
          autocomplete="off"
          class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
          [formField]="f.clientId"
        />
        @if (f.clientId().touched() && f.clientId().invalid()) {
          <span class="text-xs font-medium text-[#B3261E]" role="alert">{{
            f.clientId().errors()[0]?.message
          }}</span>
        }
      </label>

      <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B]">
        Application
        <select
          class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 text-sm text-[#14142B] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
          [formField]="f.applicationId"
        >
          <option value="">Select…</option>
          @for (o of applicationOptions(); track o.id) {
            <option [value]="o.id">{{ o.name }}</option>
          }
        </select>
        @if (f.applicationId().touched() && f.applicationId().invalid()) {
          <span class="text-xs font-medium text-[#B3261E]" role="alert">{{
            f.applicationId().errors()[0]?.message
          }}</span>
        }
      </label>

      <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-[#14142B] md:col-span-2">
        Description
        <textarea
          rows="4"
          placeholder="Description"
          class="min-h-11 w-full rounded-[10px] border border-[#D9D9E8] bg-white px-3.5 py-3 text-sm text-[#14142B] placeholder:text-[#9A9AB5] focus:border-[#F28C1B] focus:outline-none focus:ring-2 focus:ring-[#F28C1B]/30"
          [formField]="f.description"
        ></textarea>
      </label>
    </div>

    <div class="mt-8 flex flex-wrap justify-end gap-3 border-t border-[#EEEEF6] pt-6">
      <a
        routerLink="/application-clients"
        class="inline-flex min-h-11 items-center justify-center rounded-[10px] border border-[#D9D9E8] bg-white px-5 text-sm font-bold text-[#0A0A3C] transition hover:bg-[#F6F6FA] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C]"
        >Cancel</a
      >
      <app-loading-button type="submit" [loading]="loading()" loadingLabel="Saving…"
        >Create</app-loading-button
      >
    </div>
  </form>
}
