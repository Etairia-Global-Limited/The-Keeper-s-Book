<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading()"
  class="inline-flex min-h-11 items-center justify-center gap-2 rounded-[10px] px-5 text-sm font-extrabold transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0A0A3C] disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:translate-y-0 disabled:hover:shadow-none cursor-pointer"
  [class]="buttonClass()"
>
  @if (loading()) {
    <app-spinner size="sm" />
    @if (loadingLabel()) {
      <span>{{ loadingLabel() }}</span>
    } @else {
      <ng-container *ngTemplateOutlet="content" />
    }
  } @else {
    <ng-container *ngTemplateOutlet="content" />
  }
</button>

<ng-template #content><ng-content /></ng-template>
