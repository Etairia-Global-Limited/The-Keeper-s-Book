<!-- Takes the surrounding text colour (currentColor), so it works on any button or background. -->
<span
  role="status"
  [attr.aria-label]="label()"
  class="inline-block shrink-0 animate-spin rounded-full border-2 border-current border-t-transparent align-[-0.125em] motion-reduce:animate-[spin_2s_linear_infinite]"
  [class.size-4]="size() === 'sm'"
  [class.size-5]="size() === 'md'"
  [class.size-8]="size() === 'lg'"
></span>
