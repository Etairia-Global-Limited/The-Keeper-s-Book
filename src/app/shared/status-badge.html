@switch (tone()) { @case ('ok') {
<span
  class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-bold text-emerald-800 before:size-1.5 before:rounded-full before:bg-current before:content-['']"
  >{{ status() }}</span
>
} @case ('er') {
<span
  class="inline-flex items-center gap-1.5 rounded-full bg-red-50 px-2.5 py-1 text-xs font-bold text-[#B3261E] before:size-1.5 before:rounded-full before:bg-current before:content-['']"
  >{{ status() }}</span
>
} @case ('wa') {
<span
  class="inline-flex items-center gap-1.5 rounded-full bg-[#F28C1B]/15 px-2.5 py-1 text-xs font-bold text-[#9A4F00] before:size-1.5 before:rounded-full before:bg-current before:content-['']"
  >{{ status() }}</span
>
} @default {
<span
  class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-600 before:size-1.5 before:rounded-full before:bg-current before:content-['']"
  >{{ status() }}</span
>
} }
